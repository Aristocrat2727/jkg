name: Burner
options:
  bundleIdPrefix: com.burner
deploymentTarget:
  iOS: "15.0"
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift.git
    exactVersion: 16.1.1
targets:
  Burner:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: SocketIO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Burner
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: "Запись голосовых сообщений"
        NSPhotoLibraryAddUsageDescription: "Сохранение фото в галерею"
        NSPhotoLibraryUsageDescription: "Выбор фото для отправки"
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
