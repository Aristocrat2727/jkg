name: Burner
options:
  bundleIdPrefix: com.burner
deploymentTarget:
  iOS: "15.0"
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift.git
    exactVersion: 16.0.1
targets:
  Burner:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: SocketIO
    info:
      path: Burner/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: "Запись голосовых сообщений"
        NSPhotoLibraryAddUsageDescription: "Сохранение фото в галерею"
        NSCameraUsageDescription: "Отправка фото в чат"
        NSPhotoLibraryUsageDescription: "Выбор фото для отправки"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
